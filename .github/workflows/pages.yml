name: Build & publish to gh-pages

# 思路：Actions 只做「构建 + 把 site/ 推到 gh-pages 分支」，不调用 Pages API。
# 早期用 actions/configure-pages 自动建站会失败（GITHUB_TOKEN 无权创建 Pages 站点：
# "Resource not accessible by integration"）。改成推分支后，Pages 只需指向 gh-pages 的根目录。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run validate-data
      - run: npm run test
      - run: npm run build

      # 把 site/ 的内容推到 gh-pages 分支根目录（不需要任何 Pages API 权限）
      - name: Publish site/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "已发布到 gh-pages：https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
